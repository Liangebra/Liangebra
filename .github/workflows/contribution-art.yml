name: Generate contribution visualizations

on:
  workflow_dispatch:
  schedule:
    - cron: '23 19 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/contribution-art.yml']

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@0.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Generate arcade contribution animation
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman
      - name: Store generated graphics
        run: |
          mkdir -p assets/generated
          cp profile-3d-contrib/profile-night-view.svg assets/generated/contributions-3d.svg
          cp dist/pacman-contribution-graph*.svg assets/generated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh public contribution visualizations"
          git pull --rebase origin main
          git push origin HEAD:main
