name: Grow pixel civilization

on:
  workflow_dispatch:
  schedule:
    - cron: '29 4 * * 0'
  push:
    branches: [main]
    paths: ['.github/workflows/civilization.yml']

permissions:
  contents: write

concurrency:
  group: profile-civilization
  cancel-in-progress: false

jobs:
  civilization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate contribution-based pixel civilization
        uses: jihoo12/monkeys@4dcb805cc3c6a0d14b6bfb1bbbdab085f7d97820
        with:
          github_token: ${{ github.token }}
          username: Liangebra
          output: assets/civilization/monkey-civilization.svg
          holiday: auto
      - name: Publish artwork and localized links
        run: |
          test -s assets/civilization/monkey-civilization.svg
          python - <<'PY'
          from pathlib import Path
          labels = {'README.md': 'A pixel civilization grown from contributions', 'README.zh-CN.md': '由贡献记录驱动的像素文明', 'README.ja.md': '活動記録から育つピクセル文明'}
          for file, alt in labels.items():
              p = Path(file)
              s = p.read_text(encoding='utf-8')
              marker = '<!-- monkey-civilization -->'
              if marker in s:
                  continue
              start = s.index('<!-- contribution-art -->')
              end = s.index('</details>', start)
              panel = f'''{marker}
          <p align="center">
            <a href="https://github.com/jihoo12/monkeys"><img src="./assets/civilization/monkey-civilization.svg" width="100%" alt="{alt}"></a>
            <br>
            <sub><a href="https://github.com/jihoo12/monkeys">Monkey Civilization</a> · {alt}</sub>
          </p>

          '''
              p.write_text(s[:end] + panel + s[end:], encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/civilization README.md README.zh-CN.md README.ja.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh pixel civilization"
          git pull --rebase origin main
          git push origin HEAD:main
