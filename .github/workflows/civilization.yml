name: Grow pixel civilization

on:
  workflow_dispatch:
  schedule:
    - cron: '29 4 * * 0'
  push:
    branches: [main]
    paths: ['.github/workflows/civilization.yml']

permissions:
  contents: write

concurrency:
  group: profile-civilization
  cancel-in-progress: false

jobs:
  civilization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate original contribution-based pixel civilization
        uses: jihoo12/monkeys@4dcb805cc3c6a0d14b6bfb1bbbdab085f7d97820
        with:
          github_token: ${{ github.token }}
          username: Liangebra
          output: assets/civilization/monkey-civilization.svg
          holiday: auto
      - name: Publish original artwork only
        run: |
          test -s assets/civilization/monkey-civilization.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/civilization/monkey-civilization.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh pixel civilization"
          git pull --rebase origin main
          git push origin HEAD:main
